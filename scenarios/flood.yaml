id: flood
label: "Flood / Flash Flood"
category: natural
description: >
  Sustained heavy rainfall or an upstream event (dam release, levee
  failure, storm surge) causing rising water that threatens the
  organization's facilities, staff communtes, and physical records
  or equipment.

severity_levels:
  1:
    label: "Flood watch"
    framing: >
      Heavy rainfall is forecasted and a flood watch is in effect for the 
      region as a result. Waterways are running high, but no flooding has
      occurred yet.
    escalation_rate: slow
  2:
    label: "Flood warning -- localized"
    framing: >
      A flood warning is now in effect. Low-lying roads and some
      properties in the region are beginning to flood. Staff communtes are
      becoming difficult in some areas.
    escalation_rate: moderate