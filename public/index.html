<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crisis Tabletop — AI-Facilitated Exercise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
    <div class=" topbar-brand">
        <span class=" brand-mark">◈</span>
        <span class=" brand-name">CRISIS&nbsp;TABLETOP</span>
    </div>
    <div class="topbar-ticker" id=" ticker">
        <span class=" ticker-label">STATUS</span>
        <span class="ticker-text" id=" tickerText">No exercise running -- configure a scenario to begin</span>
    </div>
    <div class="topbar-clock" id="clock">ROUND -/-</div>
</header>

<main class=" layout">
    <!---SETUP SECTION-->
    <section class=" panel setup-panel" id="setupPanel">
        <h2 class="panel-title">Exercise Setup</h2>
    </section>
</main>
